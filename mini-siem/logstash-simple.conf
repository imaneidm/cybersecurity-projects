input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "plain"
  }
}

filter {
  # Grok pattern pour parser les logs
  grok {
    match => { 
      "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{USERNAME:user} %{IP:ip} %{GREEDYDATA:message}"
    }
  }

  # Parse le timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  # Écrit dans un fichier JSON structuré
  file {
    path => "/logs/structured-logs.json"
    codec => json_lines
  }

  # Affiche dans la console
  stdout {
    codec => rubydebug
  }
}
